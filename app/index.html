<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Sur les pas de saint Germain d'Auxerre</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <!-- Écran d'accueil : sommaire des chapitres -->
  <section id="screen-home" class="screen active">
    <header class="home-header">
      <h1 class="home-title" id="app-title">Sur les pas de saint Germain d'Auxerre</h1>
      <p class="home-subtitle" id="app-subtitle">Touchez un chapitre pour l'écouter</p>
    </header>
    <div class="chapter-grid" id="chapter-grid"></div>
  </section>

  <!-- Écran chapitre : illustration + lecteur audio -->
  <section id="screen-chapter" class="screen">
    <button class="btn-home" id="btn-home">⌂ Sommaire</button>
    <button class="nav-arrow nav-prev" id="btn-prev">‹</button>
    <button class="nav-arrow nav-next" id="btn-next">›</button>

    <div class="chapter-illustration">
      <img id="chapter-image" src="" alt="" />
    </div>

    <div class="chapter-panel">
      <div class="chapter-meta">
        <span class="chapter-index" id="chapter-index"></span>
        <h2 class="chapter-title" id="chapter-title"></h2>
      </div>

      <div class="audio-player">
        <button class="btn-play" id="btn-play" aria-label="Écouter">▶</button>
        <div class="audio-progress">
          <div class="audio-track" id="audio-track">
            <div class="audio-fill" id="audio-fill"></div>
            <div class="audio-handle" id="audio-handle"></div>
          </div>
          <div class="audio-time">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>
      </div>

      <div class="chapter-dots" id="chapter-dots"></div>
    </div>
  </section>

</div>

<audio id="audio-player-el" preload="none"></audio>
<script src="js/app.js"></script>
</body>
</html>
